[project]
name = "release-notifier"
version = "0.1.0"
description = "Monitor GitHub releases and notify users via Email and Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "tortoise-orm>=0.21.7",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "aiosmtplib>=3.0.0",
  "python-telegram-bot>=21.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
